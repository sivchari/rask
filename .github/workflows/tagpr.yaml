name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  tagpr:
    runs-on: ubuntu-latest
    outputs:
      tagpr-tag: ${{ steps.run-tagpr.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - id: run-tagpr
        name: Run tagpr
        uses: Songmu/tagpr@b3fb89424646b06c8aa460f50307c60b6a541425 # v1.17.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  goreleaser:
    needs: tagpr
    if: needs.tagpr.outputs.tagpr-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.tagpr.outputs.tagpr-tag }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # darwin binaries need a native macOS build (cgo +
  # Virtualization.framework), so a second goreleaser run appends them to
  # the same draft release in parallel with the Linux job.
  goreleaser-darwin:
    needs: tagpr
    if: needs.tagpr.outputs.tagpr-tag != ''
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.tagpr.outputs.tagpr-tag }}

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser (darwin)
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --parallelism 1 --config .goreleaser-darwin.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fails the job (and, since publish needs both goreleaser jobs to
      # succeed, keeps the release a draft forever instead of going public)
      # if the darwin bundled binary still embeds
      # internal/substrate/vz/embedded's placeholder rask-init instead of a
      # real one. Checked by size/content, not assumed: the real embedded
      # rask-init alone is ~40MB, far larger than a placeholder-only build
      # ever is.
      - name: Verify rask-init is embedded, not the placeholder
        run: |
          set -euo pipefail
          bins=$(find dist -type f -name rask-bundled)
          if [ -z "$bins" ]; then
            echo "::error::no rask-bundled binary found under dist/ to verify"
            exit 1
          fi
          for bin in $bins; do
            size=$(stat -f%z "$bin")
            if [ "$size" -lt 20000000 ]; then
              echo "::error::$bin is only ${size} bytes — too small to embed a real rask-init"
              exit 1
            fi
            if strings "$bin" | grep -q "RASK-INIT-PLACEHOLDER"; then
              echo "::error::$bin still embeds the internal/substrate/vz/embedded rask-init placeholder"
              exit 1
            fi
          done

  # Neither goreleaser run publishes (both keep the release a draft), so
  # publishing happens exactly once, here, after both have attached their
  # artifacts.
  publish:
    needs: [tagpr, goreleaser, goreleaser-darwin]
    if: needs.tagpr.outputs.tagpr-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tagpr.outputs.tagpr-tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
