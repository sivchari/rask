name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # internal/substrate/vz/embedded go:embeds this cross-compiled binary,
      # which is gitignored rather than committed, so a bare "go build ./..."
      # cannot compile that package on darwin without it.
      - run: make build-rask-init
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -shuffle=on -count=1 ./...
