name: release-bundle

# Builds the three bundled (`make bundle` — see the Makefile and
# cmd/bundle-payload) rask binaries: linux/amd64, linux/arm64 and
# darwin/arm64. Each carries its own component payload embedded, so a
# fresh `rask create` needs no network access to dl.k8s.io/GitHub/Alpine
# (see internal/components/bundlepayload and HANDOFF-ebs-bake.md, the
# handoff contract for haro's EBS-snapshot bake).
#
# On a tag push, every artifact plus a sha256 checksum is uploaded to that
# tag's GitHub Release (created if it doesn't exist yet). workflow_dispatch
# runs the exact same build for a manual/pre-release check, but only
# uploads plain workflow artifacts unless dispatched against a tag ref.
#
# Each target builds on a runner native to it (no cross-compilation): the
# darwin/arm64 build needs a real macOS toolchain for codesign and
# Virtualization.framework linkage, and matching that, the linux jobs also
# build natively rather than cross-compiling from macOS.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            runs-on: ubuntu-latest
          - target: linux/arm64
            runs-on: ubuntu-24.04-arm
          - target: darwin/arm64
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # internal/substrate/vz/embedded go:embeds this cross-compiled
      # binary; only darwin/arm64 actually links that package, but running
      # it uniformly on every target matches ci.yaml and costs seconds.
      - run: make build-rask-init

      - name: Stage component payload (${{ matrix.target }})
        run: make bundle-payload TARGET=${{ matrix.target }}

      - name: Build bundled binary
        run: make bundle

      - name: Package artifact
        id: package
        shell: bash
        run: |
          os="${MATRIX_TARGET%%/*}"
          arch="${MATRIX_TARGET##*/}"
          name="rask-bundled-${os}-${arch}"

          mv rask "$name"
          shasum -a 256 "$name" > "$name.sha256"

          {
            echo "### $name"
            echo "size: $(ls -lh "$name" | awk '{print $5}')"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "name=$name" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --generate-notes
          gh release upload "$tag" "${{ steps.package.outputs.name }}" "${{ steps.package.outputs.name }}.sha256" --clobber
