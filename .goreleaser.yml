version: 2

project_name: rask

# darwin/arm64 is deliberately absent: the vz substrate requires cgo and
# Apple's Virtualization.framework, which cannot be cross-compiled from a
# Linux runner. macOS users install with `go install` or `make codesign`.

before:
  hooks:
    - go mod tidy

builds:
  - id: rask
    main: ./cmd/rask
    binary: rask
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

  # Bundled variants embed the full component payload (Kubernetes binaries,
  # kine, containerd, runc, CNI plugins) so `rask create` needs no network.
  # Each build stages its own payload in a pre hook; run goreleaser with
  # --parallelism 1 so the two stagings never overlap.
  - id: rask-bundled-amd64
    main: ./cmd/rask
    binary: rask-bundled
    tags:
      - bundle
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
    hooks:
      pre:
        - go run ./cmd/bundle-payload -target linux/amd64

  - id: rask-bundled-arm64
    main: ./cmd/rask
    binary: rask-bundled
    tags:
      - bundle
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w
    hooks:
      pre:
        - go run ./cmd/bundle-payload -target linux/arm64

  # rask-init (cmd/rask-init) is the vz substrate's guest PID 1: always
  # linux/arm64 regardless of host OS/arch, since it only ever runs inside a
  # macOS host's vz VM (see internal/substrate/vz). Published as its own
  # release asset because internal/substrate/vz/embedded's go:embed only
  # captures whatever binary is at that path when a *rask* binary is built
  # (a placeholder in a read-only Go module cache) — internal/substrate/vz's
  # runtime fallback downloads this asset for module consumers whose own
  # build never had a chance to run `make build-rask-init` first.
  - id: rask-init
    main: ./cmd/rask-init
    binary: rask-init
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w

archives:
  - id: rask
    formats: ['tar.gz']
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
    ids:
      - rask

  - id: rask-bundled
    formats: ['tar.gz']
    name_template: "{{ .ProjectName }}-bundled_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
    ids:
      - rask-bundled-amd64
      - rask-bundled-arm64

  - id: rask-init
    formats: ['tar.gz']
    name_template: "rask-init_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
    ids:
      - rask-init

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc

release:
  use_existing_draft: true
  mode: append
  # Both goreleaser runs only append to the shared draft; a separate
  # workflow job publishes it once both have finished, so the two never
  # race to publish (which creates a second release for the same tag).
  draft: true
