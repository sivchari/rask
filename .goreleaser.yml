version: 2

project_name: rask

# darwin/arm64 is deliberately absent: the vz substrate requires cgo and
# Apple's Virtualization.framework, which cannot be cross-compiled from a
# Linux runner. macOS users install with `go install` or `make codesign`.
#
# Every release is bundled: rask's payload (Kubernetes binaries, kine,
# containerd, runc, CNI plugins) is embedded in the binary itself, so
# `rask create` never needs network access on first use. A cold-cache
# download eating the guest-boot deadline (a "rask create" that timed out
# after ~5 minutes on a slow network) was a real production failure; a
# slim, download-on-first-use binary is no longer published for any
# platform.

before:
  hooks:
    - go mod tidy

builds:
  # Each build stages its own payload in a pre hook; run goreleaser with
  # --parallelism 1 so the two stagings never overlap.
  - id: rask-bundled-amd64
    main: ./cmd/rask
    binary: rask-bundled
    tags:
      - bundle
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
    hooks:
      pre:
        - go run ./cmd/bundle-payload -target linux/amd64

  - id: rask-bundled-arm64
    main: ./cmd/rask
    binary: rask-bundled
    tags:
      - bundle
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w
    hooks:
      pre:
        - go run ./cmd/bundle-payload -target linux/arm64

archives:
  - id: rask-bundled
    formats: ['tar.gz']
    name_template: "{{ .ProjectName }}-bundled_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
    ids:
      - rask-bundled-amd64
      - rask-bundled-arm64

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc

release:
  use_existing_draft: true
  mode: append
  # Both goreleaser runs only append to the shared draft; a separate
  # workflow job publishes it once both have finished, so the two never
  # race to publish (which creates a second release for the same tag).
  draft: true
