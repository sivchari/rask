version: 2

project_name: rask

# Runs on a macOS runner in parallel with the Linux goreleaser job: the vz
# substrate needs cgo + Virtualization.framework, so darwin binaries must
# be built natively. Both jobs append artifacts to the same draft release
# (release.mode: append); the changelog and release notes are owned by the
# Linux config, so they are disabled here.

builds:
  - id: rask-bundled-darwin
    main: ./cmd/rask
    binary: rask-bundled
    tags:
      - bundle
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w
    hooks:
      pre:
        # internal/substrate/vz/embedded go:embeds cmd/rask-init verbatim;
        # without cross-compiling it fresh here first, this build would
        # ship the committed placeholder instead (see that package's doc
        # comment) — the exact bug this hook exists to prevent. Also
        # stages the network component payload (not rask-init).
        - make build-rask-init
        - go run ./cmd/bundle-payload -target darwin/arm64
      post:
        # Ad-hoc signing with the virtualization entitlement; required for
        # Virtualization.framework APIs. Gatekeeper may still prompt on
        # first run since this is not a notarized Developer ID signature.
        - codesign --entitlements vz.entitlements -s - -f {{ .Path }}

archives:
  - id: rask-bundled-darwin
    formats: ['tar.gz']
    name_template: "{{ .ProjectName }}-bundled_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
    ids:
      - rask-bundled-darwin

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_darwin_checksums.txt"

changelog:
  disable: true

release:
  use_existing_draft: true
  mode: append
  # Both goreleaser runs only append to the shared draft; a separate
  # workflow job publishes it once both have finished, so the two never
  # race to publish (which creates a second release for the same tag).
  draft: true
